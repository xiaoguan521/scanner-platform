name: Build & Release Artifacts

on:
  workflow_dispatch:
    inputs:
      include_zap:
        description: 'Include the optional passive ZAP engine in platform packages'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Required CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  frontend:
    name: Build Server-mode frontend
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix web

      - name: Build static UI (no demo fallback)
        run: npm run build --prefix web

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Compile binaries
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p build_output
          ext=""
          if [[ "$TARGET_GOOS" == windows ]]; then
            ext=".exe"
          fi

          # Build the platform services for the selected target.
          for command in server updater worker; do
            CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" \
              go build -trimpath -ldflags="-s -w" \
              -o "build_output/sec-$command$ext" "./cmd/$command"
          done


      - name: Install SHA-256-pinned scanner engines
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          INCLUDE_ZAP: ${{ github.event_name == 'workflow_dispatch' && inputs.include_zap == true }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "$TARGET_GOOS" == windows ]]; then
            ext=".exe"
          fi
          python3 scripts/install_engines.py \
            --engine core \
            --platform "$TARGET_GOOS" \
            --arch "$TARGET_GOARCH" \
            --destination build_output/bin
          test -s "build_output/bin/nuclei${ext}"
          test -s "build_output/bin/trivy${ext}"
          test -s build_output/bin/nuclei.installed.json
          test -s build_output/bin/trivy.installed.json

      - name: Install optional SHA-256-pinned ZAP engine
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_zap == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_engines.py \
            --engine zap \
            --platform linux \
            --arch amd64 \
            --destination build_output/bin
          test -s build_output/bin/zap/zap-2.17.0.jar
          test -s build_output/bin/zap.installed.json

      - name: Verify optional engine selection
        shell: bash
        env:
          INCLUDE_ZAP: ${{ github.event_name == 'workflow_dispatch' && inputs.include_zap == true }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_ZAP" == "true" ]]; then
            test -s build_output/bin/zap/zap-2.17.0.jar
          else
            test ! -e build_output/bin/zap
            test ! -e build_output/bin/zap.installed.json
          fi

      - name: Download reviewed frontend bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: build_output/web/dist

      - name: Verify frontend bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -s build_output/web/dist/index.html
          shopt -s nullglob
          scripts=(build_output/web/dist/assets/*.js)
          test "${#scripts[@]}" -gt 0
          # sec-server serves web/dist relative to the package root.

      - name: Compile sec-portable with the embedded frontend
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "$TARGET_GOOS" == windows ]]; then
            ext=".exe"
          fi
          # Embed the same reviewed bundle that ships in web/dist.
          find internal/webui/dist -mindepth 1 ! -name README.txt -exec rm -rf {} +
          cp -R build_output/web/dist/. internal/webui/dist/
          test -s internal/webui/dist/index.html
          CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" \
            go build -trimpath -ldflags="-s -w" \
            -o "build_output/sec-portable$ext" ./cmd/portable

      - name: Include package quickstart and offline data directories
        shell: bash
        run: |
          set -euo pipefail
          cp docs/offline-package.md build_output/README.md
          mkdir -p build_output/docs build_output/tools
          cp docs/engines.md docs/linux-server-scan.md docs/offline-vulnerability-data.md docs/portable.md docs/ssh-collection.md build_output/docs/
          cp scripts/collect_linux_inputs.py build_output/tools/
          mkdir -p build_output/runtime/inputs build_output/vuln-data build_output/config/trusted-rule-keys

      - name: Package artifacts and checksums
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          command -v tar
          command -v zip
          command -v sha256sum

          mkdir -p dist_pkg
          base="scanner-platform-$TARGET_GOOS-$TARGET_GOARCH"
          if [[ "$TARGET_GOOS" == windows ]]; then
            archive="$base.zip"
            (cd build_output && zip -q -r "../dist_pkg/$archive" .)
          else
            archive="$base.tar.gz"
            tar -czf "dist_pkg/$archive" -C build_output .
          fi

          (cd dist_pkg && sha256sum "$archive" > "$archive.sha256")

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist_pkg/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Draft Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, frontend, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all_artifacts
          pattern: package-*
          merge-multiple: true

      - name: Verify packages and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(all_artifacts/scanner-platform-*.zip all_artifacts/scanner-platform-*.tar.gz)
          checksums=(all_artifacts/scanner-platform-*.sha256)
          if [[ "${#archives[@]}" -ne 5 || "${#checksums[@]}" -ne 5 ]]; then
            echo "Expected exactly five supported platform archives and checksum files" >&2
            exit 1
          fi
          (cd all_artifacts && sha256sum --check -- *.sha256)
          mkdir -p release_assets
          cp -- "${archives[@]}" release_assets/
          (cd release_assets && sha256sum -- * > checksums.txt)

      - name: Create draft release (manual publication required)
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: true
          body: |
            Early-development packages for local, single-host validation.
            Each supported archive contains the Server, Updater, Worker, Server-mode web UI, and SHA-256-pinned Nuclei and Trivy engines. ZAP is included only when include_zap=true is selected for a manual workflow run. The archive also contains a quickstart README and checksum sidecar.
            Vulnerability data is available from the manually triggered Build Offline Vulnerability Data workflow as a separate downloadable artifact. It includes the built-in Nuclei HTTP baseline and Trivy vulnerability/Java databases; it does not install the full upstream Nuclei template library.
            When included, ZAP requires Java 17 or newer on PATH. The local Server, Worker, and Updater currently communicate over loopback; these packages are not a hardened multi-host production deployment.
            Publish this draft only after reviewing the validation record and target-platform requirements.
