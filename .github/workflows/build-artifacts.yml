name: Build & Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Required CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  frontend:
    name: Build Server-mode frontend
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix web

      - name: Build static UI (no demo fallback)
        env:
          VITE_DATA_MODE: server
        run: npm run build --prefix web

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Compile binaries
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p build_output
          ext=""
          if [[ "$TARGET_GOOS" == windows ]]; then
            ext=".exe"
          fi

          # These three binaries are Phase 0 scaffolds, not deployable clients.
          for command in server updater worker; do
            CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" \
              go build -trimpath -ldflags="-s -w" \
              -o "build_output/sec-$command$ext" "./cmd/$command"
          done

          # Build portable only when a real Go entry point is implemented.
          if [[ -f cmd/portable/main.go ]]; then
            CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" \
              go build -trimpath -ldflags="-s -w" \
              -o "build_output/sec-portable$ext" ./cmd/portable
          fi

      - name: Download reviewed frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: build_output/web

      - name: Verify frontend bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -s build_output/web/index.html
          shopt -s nullglob
          scripts=(build_output/web/assets/*.js)
          test "${#scripts[@]}" -gt 0
          # Static files are packaged for future integration. The Phase 0
          # Go Server does not currently serve these files.

      - name: Package artifacts and checksums
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          command -v tar
          command -v zip
          command -v sha256sum

          mkdir -p dist_pkg
          base="scanner-platform-$TARGET_GOOS-$TARGET_GOARCH"
          if [[ "$TARGET_GOOS" == windows ]]; then
            archive="$base.zip"
            (cd build_output && zip -q -r "../dist_pkg/$archive" .)
          else
            archive="$base.tar.gz"
            tar -czf "dist_pkg/$archive" -C build_output .
          fi

          (cd dist_pkg && sha256sum "$archive" > "$archive.sha256")

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist_pkg/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Phase 0 Draft Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, frontend, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: package-*
          merge-multiple: true

      - name: Verify packages and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(all_artifacts/scanner-platform-*.zip all_artifacts/scanner-platform-*.tar.gz)
          checksums=(all_artifacts/scanner-platform-*.sha256)
          if [[ "${#archives[@]}" -ne 6 || "${#checksums[@]}" -ne 6 ]]; then
            echo "Expected exactly six archives and checksum files" >&2
            exit 1
          fi
          (cd all_artifacts && sha256sum --check -- *.sha256)
          mkdir -p release_assets
          cp -- "${archives[@]}" release_assets/
          (cd release_assets && sha256sum -- * > checksums.txt)

      - name: Create draft release (manual publication required)
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: true
          body: |
            Phase 0 / PoC artifacts only. Not production-ready.
            Server, Updater and Worker are currently fail-closed scaffolds.
            The portable client is included only after its entry point is implemented.
            Each platform archive includes web/ static assets built in Server mode.
            These static assets are not yet served by the Phase 0 Go Server.
            User management/auth/RBAC and business APIs are not operational.
            Review security validation and platform runtime tests before publication.
