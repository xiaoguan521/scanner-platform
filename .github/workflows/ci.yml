name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Lint
        run: make lint

  test:
    name: Unit Tests (-race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Tests
        run: make test

  build-check:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-latest
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-latest
          - target: windows/amd64
            runner: windows-latest
          - target: windows/arm64
            runner: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The hosted Windows images are not guaranteed to provide GNU Make.
      # Running Go directly also verifies the project without POSIX shell assumptions.
      - name: Build All Targets
        run: go build ./...
