  "/api/v1/findings/{id}/retest":
    post:
      summary: Create one bounded retest task for a finding
      description: Admin or security_engineer only. The Server reuses the completed parent task's frozen input, narrows standalone scans to the finding target, revalidates the registered asset and current exclusions, and records an auditable finding-to-task relation. Synthetic and FALSE_POSITIVE findings are rejected; only one active retest may exist per finding.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum: [XMLHttpRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Retest task and relation created
          content:
            application/json:
              schema:
                type: object
                required: [task, retest]
                properties:
                  task:
                    "$ref": "#/components/schemas/ScanTask"
                  retest:
                    "$ref": "#/components/schemas/FindingRetest"
        '400':
          description: Finding is synthetic, unsupported, out of frozen scope, or input is invalid
        '401':
          description: Authentication required
        '403':
          description: Forbidden or mutation guard missing
        '409':
          description: Finding or parent task is missing, or an active retest already exists
