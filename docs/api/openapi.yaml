  "/api/v1/findings/batch-disposition":
    post:
      summary: Atomically update explicitly selected finding statuses
      description: Admin/security_engineer with CSRF guard. All 1–100 explicit IDs and expected statuses must match. Duplicate, missing or invalid IDs, stale status, invalid transition, event/audit failure or CAS conflict abort the entire batch. Same acceptance fields and transitions as single-item disposition. Does not run scanners or change assignment/notes/fingerprints. No-account mode follows existing local disposition semantics. Expiry remains handled by Tick/list/single-item processing.
      security:
      - sessionCookie: []
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum: [XMLHttpRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, status]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expectedStatus]
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 256
                      expectedStatus:
                        type: string
                        enum: [OPEN, REOPENED, IN_PROGRESS, FIXED, FALSE_POSITIVE, ACCEPTED_RISK]
                status:
                  type: string
                  enum: [OPEN, IN_PROGRESS, FALSE_POSITIVE, ACCEPTED_RISK]
                reason:
                  type: string
                  description: Only ACCEPTED_RISK; trimmed 1–500 UTF-8 bytes, no control characters.
                acceptedUntil:
                  type: string
                  format: date-time
                  description: Only ACCEPTED_RISK; future within 365 days.
      responses:
        '200':
          description: All selected findings updated
          content:
            application/json:
              schema:
                type: object
                required: [updated, items]
                properties:
                  updated:
                    type: integer
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Finding"
        '400':
          description: Invalid input or transition; batch unchanged
        '401':
          description: Authentication required
        '403':
          description: Forbidden or CSRF guard missing
        '409':
          description: Missing finding, stale status or concurrent conflict; batch unchanged
        '500':
          description: Storage, audit or event failure; batch unchanged
  "/api/v1/findings/{id}":
    patch:
      summary: Persist finding disposition and status event
      description: Admin or security_engineer only. ACCEPTED_RISK requires a 1–500 UTF-8 byte trimmed reason without control characters and an RFC3339 expiry strictly in the future within 365 days. Only OPEN, REOPENED or IN_PROGRESS can accept risk. Accepted risk can only be manually revoked to OPEN. Manual FIXED, changes from FIXED and no-op updates are rejected.
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Finding"
        '400':
          description: Invalid transition or acceptance fields
        '403':
          description: Forbidden or mutation guard missing
        '409':
          description: Finding missing or concurrent update conflict
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - OPEN
                  - IN_PROGRESS
                  - FALSE_POSITIVE
                  - ACCEPTED_RISK
                reason:
                  type: string
                  maxLength: 500
                  description: Required only for ACCEPTED_RISK; limit is UTF-8 bytes.
                acceptedUntil:
                  type: string
                  format: date-time
                  description: Required only for ACCEPTED_RISK; explicit timezone required.
              required:
              - status
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/findings/assignees":
    get:
      summary: Read minimal active finding assignee candidates
      description: Admin/security_engineer only. Returns id and name of active admin/security_engineer accounts; no account credentials or administrative fields.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Eligible assignees
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/FindingAssignee"
                  total:
                    type: integer
        '401':
          description: Authentication required
        '403':
          description: Only admin/security_engineer may read candidate accounts
        '503':
          description: Account authentication not configured
  "/api/v1/findings/{id}/assignee":
    put:
      summary: Set or clear a single finding assignee
      description: Admin/security_engineer only. Assignee must be an active admin/security_engineer; empty assigneeId clears assignment; null and omitted fields are rejected. Actor and target eligibility are checked within the write transaction. Rejects no-op updates. Assignment history and audit are committed atomically; asset owner and lifecycle status are unaffected.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum: [XMLHttpRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Finding"
        '400':
          description: Invalid actor, assignee, missing field or no-op
        '403':
          description: Forbidden or mutation guard missing
        '404':
          description: Finding missing
        '409':
          description: Concurrent update conflict
  "/api/v1/findings/{id}/notes":
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      summary: Read append-only finding notes
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Chronological plain-text notes with author snapshots
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/FindingNote"
                  total:
                    type: integer
        '404':
          description: Finding missing
    post:
      summary: Append a single finding note
      description: Admin/security_engineer only. Body must be valid UTF-8, 1–2000 bytes before trimming, nonblank and contain no control characters or Unicode line/paragraph separators (U+2028/U+2029). Notes are immutable plain text. Note and audit are one transaction; audit links note ID and byte count without copying body text.
      security:
      - sessionCookie: []
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum: [XMLHttpRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                  description: Limit is UTF-8 bytes, not character count.
      responses:
        '201':
          description: Appended note
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FindingNote"
        '400':
          description: Invalid note or inactive writer
        '403':
          description: Forbidden or mutation guard missing
        '404':
          description: Finding missing
  "/api/v1/findings/{id}/events":
    get:
      summary: Read finding state change history
      description: Authenticated read access. Reasons are returned as plain text; audit logs contain only event identifiers and states. Expired acceptance is reopened before reading.
