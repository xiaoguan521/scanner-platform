components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: scanner_session
  responses:
    NotImplemented:
      description: Phase 0 does not expose this operation
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: not_implemented
        message:
          type: string
    Health:
      type: object
      required:
      - state
      - role
      properties:
        state:
          type: string
          enum:
          - alive
        role:
          type: string
    NotReady:
      type: object
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - not_ready
        reason:
          type: string
    SystemStatus:
      type: object
      required:
      - role
      - phase
      - state
      - ready
      - enabled
      - unavailable
      properties:
        role:
          type: string
          enum:
          - sec-server
          - sec-portable
        phase:
          type: string
        state:
          type: string
          enum:
          - SCAFFOLD
          - RUNNING
        ready:
          type: boolean
        enabled:
          type: array
          items:
            type: string
        unavailable:
          type: array
          items:
            type: string
    Capabilities:
      type: object
      required:
      - enabled
      - unavailable
      properties:
        enabled:
          type: array
          items:
            type: string
        unavailable:
          type: array
          items:
            type: string
    Pagination:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    NewUserRequest:
      type: object
      required:
      - username
      - password
      - role
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
    UpdateUserRequest:
      type: object
      required:
      - role
      - isActive
      properties:
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
        isActive:
          type: boolean
    User:
      type: object
      required:
      - id
      - username
      - role
      - isActive
      description: Read-only management DTO. Never includes password hashes, tokens,
        or credentials.
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
        isActive:
          type: boolean
    TimeWindow:
      type: object
      required:
      - weekdays
      - start
      - end
      - timeZone
      properties:
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
        timeZone:
          type: string
          example: Asia/Shanghai
      description: End is exclusive; end before start means next day, assigned to
        starting weekday. Empty task windows mean unrestricted time. Equal start/end
        is invalid.
    NewAssetRequest:
      type: object
      required:
      - kind
      - address
      - businessGroup
      - owner
      - requestedPorts
      properties:
        kind:
          type: string
          enum:
          - host
          - image_repo
        address:
          type: string
          description: Numeric host IP or registry path
        businessGroup:
          type: string
          maxLength: 100
        owner:
          type: string
          maxLength: 100
        requestedPorts:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
        skippedPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
          maxItems: 50
          uniqueItems: true
          description: Subset of explicitly registered ports; never dispatched to
            Worker.
        name: {"type": "string"}
        department: {"type": "string"}
        phone: {"type": "string"}
        mac: {"type": "string"}
        osName: {"type": "string"}
        osFamily: {"type": "string"}
        deviceType: {"type": "string"}
        deviceSubtype: {"type": "string"}
        vendor: {"type": "string"}
        model: {"type": "string"}
        isCore: {"type": "boolean"}
    EditAssetRequest:
      type: object
      required:
      - address
      - businessGroup
      - owner
      - requestedPorts
      properties:
        address:
          type: string
          description: Numeric host IP or registry path; a changed host IP revokes related scope grants.
        businessGroup:
          type: string
          maxLength: 100
        owner:
          type: string
