          items:
            type: string
      required:
      - synthetic
      - targets
      description: Choose synthetic=true, nuclei/zap with approved registered targets, trivy with a local Worker input path/kind, port-probe for TCP connectivity only, or auto with one registered assetId and an opsApproved bounded TCP plan. Auto runs read-only HTTP(S) checks against open ports within that exact plan; it may run the embedded one-shot Linux package collector only when the Worker has a matching local SSH profile and the configured SSH port is selected and open. SSH credentials and host keys never pass through Server. SSH uses strict local known_hosts validation and public-key authentication only. No host discovery, CIDR expansion, UDP probes, remote image pulls, password authentication, brute force or active ZAP scans.
    Schedule:
      allOf:
      - "$ref": "#/components/schemas/TaskInput"
      - type: object
        properties:
          id:
            type: string
          name:
            type: string
            minLength: 1
            maxLength: 100
          nextRun:
            type: string
            format: date-time
          intervalMinutes:
            type: integer
            minimum: 0
            maximum: 525600
            description: 0 means once. Repeating missed runs are coalesced.
          enabled:
            type: boolean
          lastTaskId:
            type: string
          lastError:
            type: string
          createdBy:
            type: string
        required:
        - name
        - nextRun
        - intervalMinutes
    ScheduleRun:
      type: object
      required: [id, scheduleId, taskId, triggeredAt, status]
      properties:
        id: {type: string}
        scheduleId: {type: string}
        taskId: {type: string}
        triggeredAt: {type: string, format: date-time}
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING_WINDOW, PAUSED, PAUSED_WINDOW, COMPLETED, CANCELED, FAILED, DELETED]
        error: {type: string}
    RuleJob:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - IMPORT
          - FETCH
          - ACTIVATE
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
        version:
          type: string
        message:
          type: string
        createdAt:
          type: string
        completedAt:
          type: string
        url:
          type: string
        expectedSha256:
          type: string
        rollback:
          type: boolean
        nodeId:
          type: string
      required: []
    EngineStatus:
      type: object
      required:
      - name
      - version
      - installed
      - ready
      - message
      properties:
        name:
          type: string
        version:
          type: string
        installed:
          type: boolean
        ready:
          type: boolean
        message:
          type: string
    Detection:
      type: object
      required:
      - engine
      - templateId
      - target
      - title
      - severity
      properties:
        engine:
          type: string
          maxLength: 32
        templateId:
          type: string
          maxLength: 200
        target:
          type: string
          maxLength: 240
        title:
          type: string
          maxLength: 500
        matchedPath:
          type: string
          maxLength: 1000
        package:
          type: string
          maxLength: 300
        installedVersion:
          type: string
          maxLength: 200
        fixedVersion:
          type: string
          maxLength: 1000
        description:
          type: string
          maxLength: 4000
        severity: *1
        artifactId:
          type: string
          description: Immutable Trivy image identity; used instead of archive filename
            for deduplication.
        assetId: {"type": "string"}
        vulnCategory: {"type": "string"}
        impact: {"type": "string"}
        solution: {"type": "string"}
        evidence: {"type": "string"}
        component: {"type": "string"}
        contentLanguage: {"type": "string"}
        riskType: {"type": "string", "enum": ["system", "web", "login_entry", "weak_credential"], "description": "weak_credential is reserved and rejected by current ingestion; detection disabled."}
        detectMethod: {"type": "string", "enum": ["principle", "version", "configuration", "unknown"]}
        confidence: {"type": "string", "enum": ["high", "medium", "low", "unknown"]}
        cvssScore: {"type": "number", "minimum": 0, "maximum": 10}
        identifiers: {"type": "object", "additionalProperties": {"type": "array", "items": {"type": "string"}}}
        references: {"type": "array", "items": {"type": "string"}}
        port: {"type": "integer", "minimum": 1, "maximum": 65535}
    WorkerReport:
      type: object
      required:
      - taskId
      - workerId
      properties:
        taskId:
          type: string
        workerId:
          type: string
        target:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - ''
          - PAUSED_WINDOW
          - COMPLETED
          - FAILED
        error:
          type: string
          maxLength: 500
        findings:
          type: array
          maxItems: 2000
          items:
            "$ref": "#/components/schemas/Detection"
        portProbeResults:
          type: array
          maxItems: 65535
          items:
            "$ref": "#/components/schemas/PortProbeResult"
        serviceResults: {"type": "array", "items": {"$ref": "#/components/schemas/ServiceResult"}}
        systemScanStatus:
          type: string
          description: Fixed Worker result status for optional local SSH package collection; includes an explicit not-started state when automatic scanning fails or stops before package collection, and never contains credentials or raw remote output.
        applicationScanStatus:
          "$ref": "#/components/schemas/ApplicationScanStatus"
        applicationResults:
          type: array
          maxItems: 8
          items:
            "$ref": "#/components/schemas/ApplicationResult"
        assetProfile: {"$ref": "#/components/schemas/AssetProfile"}
        completedFully:
          type: boolean
          description: True only when the Worker completed the entire authorized scope without timeout or engine failure.
        rulesExecuted:
          type: boolean
          description: True only when at least one configured vulnerability rule engine completed successfully.
        executedEngines:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [nuclei, zap, trivy]
        ruleVersion:
          type: string
          maxLength: 200
    WorkerLeaseRenewalRequest:
      type: object
      additionalProperties: false
      required: [taskId, workerId, pinnedRuleVersion]
      properties:
        taskId:
          type: string
          maxLength: 128
        workerId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'
        pinnedRuleVersion:
          type: string
          maxLength: 200
          description: The exact rule or no-rules binding returned in the claimed TaskChunk.
    WorkerLeaseRenewal:
      type: object
