  "/api/v1/assets/import/template":
    get:
      tags: [assets]
      summary: Download UTF-8 CSV template (admin/security_engineer)
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Fixed kind,address,businessGroup,owner,name header and documentation examples
          content:
            text/csv:
              schema: {type: string}
        '401': {description: Unauthenticated}
        '403': {description: Role denied}
  "/api/v1/assets/import/preview":
    post:
      tags: [assets]
      summary: Validate and stage an asset CSV without registering assets or contacting targets
      description: 'Admin/security_engineer. UTF-8 without BOM; exact ordered kind,address,businessGroup,owner header with optional final name. At most 1 MiB and 1000 data records. Numeric IP hosts and existing image_repo format only. No port columns. Each invalid row includes its CSV line and reason. Any invalid/duplicate row blocks the entire import. A valid preview is staged for 15 minutes, bound to its user, and replaces that user''s earlier preview.'
      security: [{sessionCookie: []}]
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema: {type: string, enum: [XMLHttpRequest]}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, maxLength: 1048576}
      responses:
        '200':
          description: Row validation results; previewId and expiresAt exist only for fully valid batches
          content:
            application/json:
              schema:
                type: object
                required: [total, valid, invalid, rows]
                properties:
                  previewId: {type: string}
                  expiresAt: {type: string, format: date-time}
                  total: {type: integer}
                  valid: {type: integer}
                  invalid: {type: integer}
                  rows:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required: [row, kind, address, businessGroup, owner]
                      properties:
                        row: {type: integer, minimum: 2}
                        kind: {type: string}
                        address: {type: string}
                        businessGroup: {type: string}
                        owner: {type: string}
                        name: {type: string}
                        reason: {type: string}
        '400': {description: Invalid encoding/header/CSV format or empty data}
        '401': {description: Unauthenticated}
        '403': {description: Role or CSRF guard denied}
        '413': {description: Byte or row limit exceeded}
        '415': {description: text/csv with UTF-8 required}
  "/api/v1/assets/import/confirm":
    post:
      tags: [assets]
      summary: Atomically confirm the same user's unexpired staged preview
      description: 'Admin/security_engineer. Only previewId is accepted; client rows cannot override staging. Repeated, expired, replaced or other-user previews fail closed. A unique asset conflict after preview rolls back all assets, profiles and audit changes. No ports, authorization or target requests are created. Successful audit contains only imported count; staged row data is cleared.'
      security: [{sessionCookie: []}]
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema: {type: string, enum: [XMLHttpRequest]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewId]
              properties:
                previewId: {type: string, maxLength: 128}
      responses:
        '201':
          description: Complete batch registered
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported: {type: integer, minimum: 1, maximum: 1000}
        '400': {description: Invalid confirmation JSON or unknown fields}
        '401': {description: Unauthenticated}
        '403': {description: Role or CSRF guard denied}
        '409': {description: Preview unavailable/expired/confirmed or asset conflict; nothing imported}
  "/api/v1/audit-logs":
    get:
      tags: [audit]
      summary: Admin-only read-only audit log projection
      description: 'Returns only stable audit fields. Historical detail is intentionally omitted because it may contain sensitive business data, targets or credentials. Supports exact actor/action/objectType filters and an inclusive RFC3339 time range.'
      security: [{sessionCookie: []}]
      parameters:
      - in: query
        name: actor
        schema: {type: string, maxLength: 128}
      - in: query
        name: action
        schema: {type: string, maxLength: 128}
      - in: query
        name: objectType
        schema: {type: string, maxLength: 64}
      - in: query
        name: from
        description: Inclusive UTC-normalized RFC3339 timestamp
        schema: {type: string, format: date-time}
      - in: query
        name: to
        description: Inclusive UTC-normalized RFC3339 timestamp
        schema: {type: string, format: date-time}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Paginated safe audit projection
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items: {"$ref": "#/components/schemas/AuditLog"}
        '400': {description: Invalid or repeated filter/query parameter}
        '401': {description: Unauthenticated}
        '403': {description: Admin role required}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: scanner_session
  responses:
    NotImplemented:
      description: Phase 0 does not expose this operation
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: not_implemented
        message:
          type: string
    DashboardSummary:
      type: object
      required: [assetCount, taskCount, runningTaskCount, riskScore, riskyAssetCount, findingCount, criticalCount, highCount, severityDistribution, findingCounts, trend, riskGroups, riskAssets, pendingCount, pendingFindings]
      properties:
        assetCount: {type: integer, minimum: 0}
        taskCount: {type: integer, minimum: 0}
        runningTaskCount: {type: integer, minimum: 0}
        hasNonSyntheticTask: {type: boolean}
        hasCompletedScan: {type: boolean}
        riskScore: {type: integer, minimum: 0, maximum: 100}
        riskyAssetCount: {type: integer, minimum: 0}
        findingCount: {type: integer, minimum: 0}
        criticalCount: {type: integer, minimum: 0}
        highCount: {type: integer, minimum: 0}
        severityDistribution: {type: object, additionalProperties: {type: integer, minimum: 0}}
        findingCounts: {$ref: "#/components/schemas/DashboardFindingCounts"}
        trend: {type: array, maxItems: 90, items: {$ref: "#/components/schemas/DashboardTrendPoint"}}
        riskGroups: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/DashboardRiskGroup"}}
        riskAssets: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/DashboardRiskAsset"}}
        pendingCount: {type: integer, minimum: 0}
        pendingFindings: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/DashboardPendingFinding"}}
        currentRule: {$ref: "#/components/schemas/RuleBundle"}
    DashboardFindingCounts:
      type: object
      required: [vulnerabilities, loginEntries, unknown, version, verified]
      properties:
        vulnerabilities: {type: integer, minimum: 0}
        loginEntries: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
        version: {type: integer, minimum: 0}
        verified: {type: integer, minimum: 0}
    DashboardTrendPoint:
      type: object
      required: [date, label, count]
      properties:
        date: {type: string, format: date}
        label: {type: string}
        count: {type: integer, minimum: 0}
    DashboardRiskGroup:
      type: object
      required: [name, score, openCount]
      properties:
        name: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        openCount: {type: integer, minimum: 0}
    DashboardRiskAsset:
      type: object
      required: [id, name, address, score, openCount]
      properties:
        id: {type: string}
        name: {type: string}
        address: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        openCount: {type: integer, minimum: 0}
    DashboardPendingFinding:
      type: object
      required: [id, severity, title, target, status, businessGroup]
      properties:
        id: {type: string}
        severity: {type: string, enum: [CRITICAL, HIGH]}
        title: {type: string}
        target: {type: string}
        status: {type: string, enum: [OPEN, REOPENED, IN_PROGRESS]}
        businessGroup: {type: string}
    AuditLog:
      type: object
      required: [id, actor, action, objectType, objectId, createdAt]
      properties:
        id: {type: string}
        actor: {type: string}
        action: {type: string}
        objectType: {type: string}
        objectId: {type: string}
        createdAt: {type: string, format: date-time}
    Health:
      type: object
      required:
      - state
      - role
      properties:
        state:
          type: string
          enum:
          - alive
        role:
          type: string
    NotReady:
      type: object
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - not_ready
        reason:
          type: string
    SystemStatus:
      type: object
      required:
      - role
      - phase
      - state
      - ready
      - enabled
      - unavailable
      properties:
        role:
          type: string
          enum:
          - sec-server
          - sec-portable
        phase:
          type: string
        state:
          type: string
          enum:
          - SCAFFOLD
          - RUNNING
        ready:
          type: boolean
        enabled:
          type: array
          items:
            type: string
        unavailable:
          type: array
          items:
            type: string
    Capabilities:
      type: object
      required:
      - enabled
      - unavailable
      properties:
        enabled:
          type: array
          items:
            type: string
        unavailable:
          type: array
          items:
            type: string
    Pagination:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    NewUserRequest:
      type: object
      required:
      - username
      - password
      - role
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
    UpdateUserRequest:
      type: object
      required:
      - role
      - isActive
      properties:
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
        isActive:
          type: boolean
    User:
      type: object
      required:
      - id
      - username
      - role
      - isActive
      description: Read-only management DTO. Never includes password hashes, tokens,
        or credentials.
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - security_engineer
          - ops_approver
          - viewer
        isActive:
          type: boolean
    TimeWindow:
      type: object
      required:
      - weekdays
      - start
      - end
      - timeZone
      properties:
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
        timeZone:
          type: string
          example: Asia/Shanghai
      description: End is exclusive; end before start means next day, assigned to
        starting weekday. Empty task windows mean unrestricted time. Equal start/end
        is invalid.
    NewAssetRequest:
      type: object
      required:
      - kind
      - address
      - businessGroup
      - owner
      - requestedPorts
      properties:
        kind:
          type: string
          enum:
          - host
          - image_repo
        address:
          type: string
          description: Numeric host IP or registry path
        businessGroup:
          type: string
          maxLength: 100
        owner:
          type: string
          maxLength: 100
        requestedPorts:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
        skippedPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
          maxItems: 50
          uniqueItems: true
          description: Subset of explicitly registered ports; never dispatched to
            Worker.
        name: {"type": "string"}
        department: {"type": "string"}
        phone: {"type": "string"}
        mac: {"type": "string"}
        osName: {"type": "string"}
        osFamily: {"type": "string"}
        deviceType: {"type": "string"}
        deviceSubtype: {"type": "string"}
        vendor: {"type": "string"}
        model: {"type": "string"}
        isCore: {"type": "boolean"}
    EditAssetRequest:
      type: object
      required:
      - address
      - businessGroup
      - owner
      - requestedPorts
      properties:
        address:
          type: string
          description: Numeric host IP or registry path; a changed host IP revokes related scope grants.
        businessGroup:
          type: string
          maxLength: 100
        owner:
          type: string
          maxLength: 100
        requestedPorts:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            minimum: 1
