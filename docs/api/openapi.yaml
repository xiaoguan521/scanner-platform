---
openapi: 3.0.3
info:
  title: Scanner Platform local business API
  version: 0.7.0
  description: 'Same-origin local development API. UI mutations require X-Requested-With:
    XMLHttpRequest and admin/security_engineer unless stated otherwise. Accounts use
    HttpOnly session cookies. Worker/Updater endpoints are loopback-only local development
    protocols. Synthetic tasks never contact targets. Explicitly authorized numeric targets can run bounded read-only checks. Worker report JSON is limited to 32 MiB; report snapshot 32 MiB, artifact 64 MiB. Rule integrity
    validation is not signature or engine compatibility validation.'
servers:
- url: "/"
  description: Same-origin UI API (dev proxy for localhost)
tags:
- name: system
- name: future
- name: accounts
- name: assets
- name: approvals
- name: audit
paths:
  "/healthz":
    get:
      tags:
      - system
      summary: Liveness only; not readiness
      responses:
        '200':
          description: Scaffold process is alive
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/readyz":
    get:
      summary: Local control-plane readiness, not scanner readiness
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                    - ready
                  mode:
                    type: string
                required: []
  "/api/v1/system/status":
    get:
      tags:
      - system
      summary: Read-only status (does not imply engine health)
      responses:
        '200':
          description: Status of local control-plane scaffold
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemStatus"
  "/api/v1/system/capabilities":
    get:
      tags:
      - system
      summary: Explicitly enabled and unavailable capabilities
      responses:
        '200':
          description: Capability availability
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Capabilities"
  "/api/v1/dashboard/summary":
    get:
      tags:
      - system
      summary: Authenticated dashboard aggregate
      description: 'Returns bounded dashboard counts, trend buckets, risk group/asset summaries and up to five pending critical/high finding projections. The response excludes evidence, credentials, raw requests/responses and engine output. The optional days value is 7, 30 or 90 and defaults to 30.'
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          enum: [7, 30, 90]
          default: 30
      responses:
        '200':
          description: Dashboard aggregate for the authenticated local dataset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardSummary"
        '400': {description: Invalid trend window}
        '401': {description: Unauthenticated}
  "/api/v1/auth/login":
    post:
      tags:
      - accounts
      summary: Log in on local development server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Session cookie issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Invalid credentials
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/auth/me":
    get:
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Missing or expired session
  "/api/v1/auth/logout":
    post:
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Session revoked
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/users":
    get:
      tags:
      - accounts
      summary: Admin-only SQLite user list
      security:
      - sessionCookie: []
      responses:
        '401':
          description: Unauthenticated
        '403':
          description: Admin role required
        '200':
          description: User list
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        "$ref": "#/components/schemas/User"
    post:
      tags:
      - accounts
      summary: Admin-only account creation
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NewUserRequest"
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Unauthenticated
        '403':
          description: Admin role required
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/users/{id}":
    patch:
      tags:
      - accounts
      summary: Admin-only role and active-state update
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserRequest"
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden update
  "/api/v1/assets":
    get:
      tags:
      - assets
      summary: Authenticated SQLite asset registry list
      security:
      - sessionCookie: []
      responses:
        '401':
          description: Missing session
        '200':
          description: Asset list (requested ports do not grant scanning permission)
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        "$ref": "#/components/schemas/Asset"
    post:
      tags:
      - assets
      summary: Register an asset and unapproved port requests
      description: Only admin or security_engineer can register assets. Does not approve
        ports or start scanning.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NewAssetRequest"
      responses:
        '201':
          description: Newly registered asset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Asset"
        '400':
          description: Invalid address, metadata or port request
        '403':
          description: Insufficient role
        '409':
          description: Duplicate asset
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/assets/export":
    get:
      tags:
      - assets
      summary: Export the authenticated asset registry as CSV
      description: 'Returns a UTF-8 CSV of stable asset-register fields. An optional q filter uses the same address, name, business-group and owner search as the Assets page. Service details, login entries, request/response evidence and engine output are never included. Spreadsheet formula markers are prefixed before export.'
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 160
        description: Current asset-list search text; repeated or NUL-containing values are rejected.
      responses:
        '200':
          description: UTF-8 CSV asset register
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400': {description: Invalid or repeated search filter}
        '401': {description: Unauthenticated}
  "/api/v1/assets/reachability-test":
    post:
      tags:
      - assets
      summary: Test the numeric IP currently entered in an asset form
      description: Only admin or security_engineer. Sends one ICMP echo with a 2.5 second timeout. The address need not be saved, and the result is not persisted.
      security:
      - sessionCookie: []
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              properties:
                address:
                  type: string
                  description: A single numeric IPv4 or IPv6 address; no hostname or CIDR.
      responses:
        '200':
          description: Reachability hint; NO_RESPONSE does not prove the host is offline
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reachability"
        '400':
          description: Address is not an allowed numeric IP
        '403':
          description: Insufficient role
  "/api/v1/assets/{id}":
    patch:
      tags:
      - assets
      summary: Update asset address, owner, business group and port requests
      description: Only admin or security_engineer. Changing a host IP revokes related scope grants and clears its reachability result; port decisions are reset.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EditAssetRequest"
      responses:
        '200':
          description: Updated asset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Asset"
        '400':
          description: Invalid metadata or port request
        '403':
          description: Insufficient role
        '404':
          description: No matching asset
        '409':
          description: Duplicate asset address
    delete:
      tags:
      - assets
      summary: Delete an asset without authorization records
      description: Only admin or security_engineer. Revoke and delete related scopes first.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '200':
          description: Asset deleted
        '403':
          description: Insufficient role
        '404':
          description: No matching asset
        '409':
          description: Asset still has related authorization records
  "/api/v1/assets/{id}/reachability-check":
    post:
      tags:
      - assets
      summary: Immediately refresh one registered host's ICMP reachability status
      description: Only admin or security_engineer. Used by the asset form after registration or an IP change. One echo request with a 2.5 second timeout. The Server also checks registered hosts periodically. No response does not prove the host is offline.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '200':
          description: Reachability hint
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - checkedAt
                properties:
                  status:
                    type: string
                    enum:
                    - REACHABLE
                    - NO_RESPONSE
                    - CHECK_FAILED
                  checkedAt:
                    type: string
                    format: date-time
        '400':
          description: Asset is not a registered host
        '403':
          description: Insufficient role
        '404':
          description: No matching asset
  "/api/v1/assets/{id}/port-requests":
    post:
      tags:
      - assets
      summary: Submit one discovered port as an unapproved request
      description: Only admin or security_engineer. Does not grant scan permission; an ops approver must review it.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - port
              properties:
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
      responses:
        '201':
          description: Port is now pending review
        '400':
          description: Invalid port request
        '403':
          description: Insufficient role
        '404':
          description: No matching asset
        '409':
          description: Port is already requested, skipped, or quarantined
  "/api/v1/assets/{id}/port-requests/batch":
    post:
      tags:
      - assets
      summary: Submit a batch of discovered ports as individual unapproved requests
      description: Only admin or security_engineer. Accepts 1–1024 unique ports atomically. Does not grant scan permission; an ops approver must review every port.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ports
              properties:
                ports:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                    maximum: 65535
      responses:
        '201':
          description: All ports are now pending review
        '400':
          description: Invalid port request
        '403':
          description: Insufficient role
        '404':
          description: No matching asset
        '409':
          description: At least one port is already requested, skipped, or quarantined; no request is inserted
  "/api/v1/port-quarantines":
    get:
      summary: Authenticated local port-quarantines
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PortQuarantine"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
  "/api/v1/scopes":
    get:
      tags:
      - approvals
      summary: Authenticated scope requests list, not execution rights
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All scope applications
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        "$ref": "#/components/schemas/AuthorizedScope"
        '401':
          description: Missing session
    post:
      tags:
      - approvals
      summary: Apply for scope of a registered numeric host IP
      description: Requires admin or security_engineer; application starts PENDING.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ScopeApplication"
      responses:
        '201':
          description: Pending request (not a Worker scan grant)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthorizedScope"
        '400':
          description: Invalid scope or time window
        '403':
          description: Insufficient role
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/scopes/{id}":
    put:
      tags:
      - approvals
      summary: Edit a scope request and return it to pending review
      description: Admin or security_engineer only; any old approval is cleared.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ScopeApplication"
      responses:
        '200':
          description: Updated pending scope request
        '403':
          description: Insufficient role
        '404':
          description: No matching scope
        '409':
          description: Scope is no longer editable
    delete:
      tags:
      - approvals
      summary: Delete a non-approved scope record
      description: An approved scope must first be revoked.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '200':
          description: Scope record deleted
        '403':
          description: Insufficient role
        '404':
          description: No matching scope
        '409':
          description: Approved scope must be revoked before deletion
  "/api/v1/scopes/{id}/revoke":
    post:
      tags:
      - approvals
      summary: Revoke an approved scope
      description: Admin, security_engineer or ops_approver; does not delete the audit record.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '200':
          description: Scope is revoked
        '403':
          description: Insufficient role
        '404':
          description: No matching scope
        '409':
          description: Scope is not currently approved
  "/api/v1/scopes/{id}/review":
    post:
      tags:
      - approvals
      summary: Review a pending scope application
      description: Admin or ops_approver only, and must be a different user than the
        applicant.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReviewDecision"
      responses:
        '200':
          description: Reviewed scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthorizedScope"
        '403':
          description: Reviewer is applicant or insufficient role
        '409':
          description: Already reviewed, expired or changed
  "/api/v1/port-requests":
    get:
      tags:
      - approvals
      summary: Authenticated list of registered port requests
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Port review status and request identities
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        "$ref": "#/components/schemas/PortRequest"
  "/api/v1/port-requests/{assetId}/{port}/review":
    post:
      tags:
      - approvals
      summary: Explicit port review (not a scan command)
      description: Admin or ops_approver only; reviewer cannot be request author.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: string
      - in: path
        name: port
        required: true
        schema:
          type: string
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReviewDecision"
      responses:
        '200':
          description: Port decision recorded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PortRequest"
        '403':
          description: Reviewer is applicant or insufficient role
        '409':
          description: Already reviewed or quarantined
  "/api/v1/tasks":
    get:
      summary: Authenticated local tasks with an optional archive-state filter
      parameters:
      - in: query
        name: archived
        required: false
        schema:
          type: string
          enum: ["true", "false", "all"]
          default: all
        description: true returns archived tasks, false returns active tasks, and all or omitted returns both.
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ScanTask"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
    post:
      summary: Queue a synthetic or explicitly selected real engine task
      responses:
        '201':
          description: Local operation result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanTask"
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TaskInput"
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/findings":
    get:
      summary: Authenticated local findings
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Finding"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
  "/api/v1/nodes":
    get:
      summary: Authenticated local nodes
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/NodeInfo"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
  "/api/v1/rules":
    get:
      summary: Authenticated local rules
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/RuleBundle"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
  "/api/v1/schedules":
    get:
      summary: Authenticated local schedules
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Schedule"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
    post:
      summary: Persist a one-shot or interval schedule
      responses:
        '201':
          description: Local operation result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Schedule"
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Schedule"
      parameters:
      - in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
  "/api/v1/rule-jobs":
    get:
      summary: Authenticated local rule-jobs
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/RuleJob"
                  total:
                    type: integer
                required:
                - items
                - total
      security:
      - sessionCookie: []
  "/api/v1/auth/setup":
    get:
      summary: Whether first-admin initialization is required
      responses:
        '200':
          description: Local operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  required:
                    type: boolean
                required: []
    post:
      summary: Initialize exactly one first admin; returns 409 after setup
